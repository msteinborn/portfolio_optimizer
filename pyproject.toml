[project]
name = "portfolio-optimizer"
version = "0.2.0"
description = "International Equity Mean-Variance Portfolio Optimizer"
requires-python = ">=3.10"
dependencies = [
    "flet>=1.0.0",
    "numpy>=1.26.0",
    "scipy>=1.11.0",
    "matplotlib>=3.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
